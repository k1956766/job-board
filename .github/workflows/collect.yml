name: collect

on:
  schedule:
    - cron: "17 * * * *"      # 매시 17분에 깨어나서, 설정한 수집 간격이 됐을 때만 수집
  workflow_dispatch:
    inputs:
      force:
        description: "간격과 상관없이 바로 수집"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write   # 60일 동안 저장소 변경이 없어도 예약 실행이 꺼지지 않게 다시 켜 두는 데 사용

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 수집
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          RUNNER: github
          SKIP_SOURCES: ${{ vars.SKIP_SOURCES }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
        run: node collector/run.js
      - name: 예약 실행 유지
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable" || true
